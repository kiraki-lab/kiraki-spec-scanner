<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>TEST · 챌린저스 구간 빌드 계산기</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f7fa;
      color: #14213d;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .loader {
      width: min(420px, calc(100% - 40px));
      padding: 28px;
      border: 1px solid #dce2ea;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 18px 40px rgba(20, 33, 61, .08);
    }
    .loader strong { display: block; margin-bottom: 8px; font-size: 20px; }
    .loader p { margin: 0; color: #607085; line-height: 1.6; }
  </style>
  <script>
    (async () => {
      const productionIndex = new URL('../v2/index.html?source=v2-test', window.location.href);
      const response = await fetch(productionIndex, { cache: 'no-store' });
      if (!response.ok) throw new Error(`production index load failed: ${response.status}`);
      let html = await response.text();
      html = html.replace('<head>', '<head>\n  <base href="../v2/" />\n  <meta name="robots" content="noindex,nofollow" />\n  <script src="/kiraki-spec-scanner/challengers/v2-test/test-env.js?v=0.1.0"><\/script>');
      html = html.replace('<title>', '<title>TEST · ');
      html = html.replace('</body>', '  <script src="/kiraki-spec-scanner/challengers/v2-test/test-overrides.js?v=0.1.0" defer><\/script>\n</body>');
      document.open();
      document.write(html);
      document.close();
    })().catch((error) => {
      document.body.innerHTML = `<main class="loader"><strong>테스트판을 불러오지 못했습니다.</strong><p>${String(error.message || error)}</p></main>`;
    });
  </script>
</head>
<body>
  <main class="loader">
    <strong>테스트판 준비 중</strong>
    <p>공개판을 기준으로 격리된 테스트 환경을 불러오고 있습니다.</p>
  </main>
</body>
</html>
