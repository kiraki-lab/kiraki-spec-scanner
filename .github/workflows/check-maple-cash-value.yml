name: Check Maple Cash Value

on:
  pull_request:
    paths:
      - 'maple-cash-value/**'
      - '.github/workflows/check-maple-cash-value.yml'

permissions:
  contents: read

concurrency:
  group: check-maple-cash-value-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: maple-cash-value
    env:
      # 판매 기간의 오프셋 없는 시각은 KST 로 읽는다(scripts/adoption-cases.json '오프셋 없는 시각').
      # 러너 기본값은 UTC 라 그대로 두면 crosscheck_adoption.js 가 그 사례에서 갈라진다.
      TZ: Asia/Seoul
      PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      # 하나가 실패해도 나머지는 끝까지 돌려 한 번에 본다.
      - name: test_credit.js
        if: ${{ !cancelled() }}
        run: node scripts/test_credit.js

      - name: test_collector.js
        if: ${{ !cancelled() }}
        run: node scripts/test_collector.js

      - name: crosscheck_adoption.js
        if: ${{ !cancelled() }}
        run: node scripts/crosscheck_adoption.js

      - name: test_ingest_run.py
        if: ${{ !cancelled() }}
        run: python scripts/test_ingest_run.py

      - name: test_merge_run.py
        if: ${{ !cancelled() }}
        run: python scripts/test_merge_run.py

      - name: 화면 검사 (test_page.js)
        if: ${{ !cancelled() }}
        run: node scripts/test_page.js
