<!doctype html>
<html lang="ko" data-theme="pink">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fff0f5">
  <link rel="icon" href="./favicon.svg?v=20260712" type="image/svg+xml">
  <title>키라키 캐시 효율 계산기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=0.14.3">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <p class="eyebrow">스카니아 · 월드 통합 경매장</p>
        <h1>키라키 캐시 효율 계산기</h1>
        <div class="brand-actions">
          <a class="channel-link" href="https://youtube.com/channel/UCTa93vcBRawFA1YLyDOAkdw?si=RAosYvNcb20jcBWu" target="_blank" rel="noopener noreferrer">키라키 채널 방문</a>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="sync-card" aria-live="polite">
          <span class="sync-dot"></span>
          <div>
            <strong id="sync-state">데이터 로딩 중</strong>
            <span id="sync-detail">최신 가격을 불러오고 있습니다.</span>
          </div>
        </div>
      </div>
    </header>

    <section class="summary-grid" aria-label="요약">
      <article class="metric">
        <span class="metric-label">랭킹 기준</span>
        <strong id="rank-mode-label">매물 최저가</strong>
      </article>
      <article class="metric">
        <span class="metric-label">현재 필터 최고</span>
        <strong id="best-efficiency">-</strong>
      </article>
      <article class="metric">
        <span class="metric-label">마지막 경매장 반영</span>
        <strong id="auction-updated">-</strong>
      </article>
      <article class="metric">
        <span class="metric-label">계산 품목</span>
        <strong id="sale-item-count">-</strong>
      </article>
    </section>

    <section class="controls" aria-label="계산 기준">
      <div class="controls-heading">
        <h2>계산 기준 설정</h2>
      </div>
      <label class="search">
        <span>검색</span>
        <input id="search-input" type="search" placeholder="아이템명 · 구성품 검색" autocomplete="off">
      </label>

      <div class="control-field">
        <div class="control-label-row">
          <label for="category-filter">세부 분류</label>
          <label class="package-toggle">
                <input id="package-filter-toggle" type="checkbox" checked>
                <span class="toggle-track" aria-hidden="true"></span>
                <strong>패키지 전체</strong>
                <em id="package-filter-state">ON</em>
              </label>
        </div>
        <select id="category-filter">
          <option value="">전체</option>
        </select>
      </div>

      <label>
        <span>가격 상태</span>
        <select id="status-filter">
          <option value="">전체</option>
          <option value="live">가격 있음</option>
          <option value="seed">기본값</option>
          <option value="no_listing">매물 없음</option>
          <option value="no_candidate">정확한 품목 없음</option>
          <option value="unverified">미확인</option>
        </select>
      </label>

      <label>
        <span>상품권 할인율</span>
        <input id="discount-rate" type="number" min="0" max="100" step="0.1">
      </label>
      <label>
        <span>수수료</span>
        <select id="ah-fee-rate">
          <option value="5">5% 일반</option>
          <option value="3">3% MVP</option>
        </select>
      </label>
      <label>
        <span>1억당 마일리지 시세</span>
        <input id="base-mp-rate" type="number" min="0" step="10">
      </label>
    </section>

    <details class="filter-panel compact-panel" aria-label="큰 분류 필터" open>
      <summary class="compact-summary filter-summary">
        <span>큰 분류</span>
        <button id="major-filter-reset" type="button">초기화</button>
      </summary>
      <div class="filter-panel-body">
        <div class="filter-group major-filter-group">
          <div id="major-filter-list" class="major-filter-list" role="group" aria-label="큰 분류"></div>
          <div id="job-group-filter-wrap" class="job-group-filter" hidden>
            <span class="job-group-label">직업군</span>
            <div id="job-group-filter-list" class="job-group-list" role="group" aria-label="직업군"></div>
          </div>
        </div>
      </div>
    </details>


    <main>
      <section class="table-panel" aria-label="효율 목록">
        <div class="section-title">
          <h2>효율 목록</h2>
          <div class="table-heading-actions">
            <button id="reset-local-prices" class="local-reset-button" type="button"
              title="이 브라우저에서 수정한 매물가와 시세 참고가 전체 초기화">전체 초기화</button>
            <label class="page-size-control">
              <select id="page-size" aria-label="페이지당 표시 개수">
                <option value="10">10개씩</option>
                <option value="20">20개씩</option>
                <option value="0">전체</option>
              </select>
            </label>
            <span id="row-count" class="count-pill">0개</span>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">순위</th>
                <th scope="col">아이템</th>
                <th scope="col">구매 가격</th>
                <th scope="col">매물가/참고가</th>
                <th scope="col" class="efficiency-heading"><span>판매 효율</span><small>1억당 현금</small></th>
              </tr>
            </thead>
            <tbody id="item-rows"></tbody>
          </table>
        </div>
        <nav class="table-pagination" aria-label="효율 목록 페이지">
          <button id="page-prev" class="page-button" type="button" aria-label="이전 페이지" title="이전 페이지">‹</button>
          <span id="page-state" aria-live="polite">0 / 0</span>
          <button id="page-next" class="page-button" type="button" aria-label="다음 페이지" title="다음 페이지">›</button>
        </nav>
      </section>

      <details class="market-info">
        <summary class="compact-summary"><span>판매 정보</span></summary>
        <div class="side-stack">
          <section class="notice-panel" aria-label="캐시샵 업데이트">
            <div class="section-title">
              <h2>캐시샵 업데이트</h2>
            </div>
            <div id="notice-list" class="notice-list"></div>
          </section>

          <section class="sale-panel" aria-label="판매 품목">
            <div class="section-title">
              <h2>판매 품목</h2>
            </div>
            <div class="sale-filters" aria-label="판매 품목 필터">
              <label>
                <span>품목 검색</span>
                <input id="sale-search-input" type="search" placeholder="판매 품목 검색" autocomplete="off">
              </label>
              <label>
                <span>판매글</span>
                <select id="sale-group-filter">
                  <option value="">전체 판매글</option>
                </select>
              </label>
              <label>
                <span>품목 분류</span>
                <select id="sale-type-filter">
                  <option value="">전체 분류</option>
                  <option value="패키지">패키지</option>
                  <option value="쿠폰">쿠폰</option>
                  <option value="확률형">확률형</option>
                  <option value="펫">펫</option>
                  <option value="펫장비">펫장비</option>
                  <option value="치장">치장</option>
                  <option value="기타">기타</option>
                </select>
              </label>
              <label>
                <span>상태</span>
                <select id="sale-review-filter">
                  <option value="all">전체</option>
                  <option value="confirmed">확인됨</option>
                  <option value="review">확인 필요</option>
                </select>
              </label>
            </div>
            <div id="sale-item-list" class="sale-list"></div>
          </section>
        </div>
      </details>
    </main>
  </div>

  <template id="empty-template">
    <tr>
      <td colspan="5" class="empty">표시할 항목이 없습니다.</td>
    </tr>
  </template>

  <script type="module" src="./app.js?v=0.14.8"></script>
</body>
</html>
