<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f3f5f8">
  <title>메이플 캐시 효율 계산기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=0.9.3">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">스카니아 · 월드 통합 경매장</p>
        <h1>메이플 캐시 효율 계산기</h1>
      </div>
      <div class="topbar-actions">
        <div class="mode-card" aria-live="polite">
          <span class="mode-label" id="mode-label">공개 모드</span>
          <div class="mode-form">
            <input id="mode-password" type="password" inputmode="numeric" placeholder="비밀번호" autocomplete="off" aria-label="모드 비밀번호">
            <button id="unlock-mode" type="button">열기</button>
            <button id="lock-mode" type="button" hidden>잠금</button>
          </div>
          <small id="mode-detail">수동 계산 · 내 브라우저 가격 수정</small>
        </div>
        <div class="sync-card" aria-live="polite">
          <span class="sync-dot"></span>
          <div>
            <strong id="sync-state">데이터 로딩 중</strong>
            <span id="sync-detail">최신 가격을 불러오고 있습니다.</span>
          </div>
        </div>
      </div>
    </header>

    <section class="summary-grid" aria-label="요약">
      <article class="metric">
        <span class="metric-label">랭킹 기준</span>
        <strong id="rank-mode-label">매물 최저가</strong>
      </article>
      <article class="metric">
        <span class="metric-label">최고 효율</span>
        <strong id="best-efficiency">-</strong>
      </article>
      <article class="metric">
        <span class="metric-label">경매장 갱신</span>
        <strong id="auction-updated">-</strong>
      </article>
      <article class="metric">
        <span class="metric-label">판매 품목</span>
        <strong id="sale-item-count">-</strong>
      </article>
    </section>

    <section class="controls" aria-label="계산 기준">
      <label class="search">
        <span>검색</span>
        <input id="search-input" type="search" placeholder="아이템명 · 구성품 검색" autocomplete="off">
      </label>

      <div class="control-field">
        <div class="control-label-row">
          <label for="category-filter">표 분류</label>
          <label class="package-toggle">
                <input id="package-filter-toggle" type="checkbox" checked>
                <span class="toggle-track" aria-hidden="true"></span>
                <strong>패키지 전체</strong>
                <em id="package-filter-state">ON</em>
              </label>
        </div>
        <select id="category-filter">
          <option value="">전체</option>
        </select>
      </div>

      <label>
        <span>가격 상태</span>
        <select id="status-filter">
          <option value="">전체</option>
          <option value="live">가격 있음</option>
          <option value="seed">기본값</option>
          <option value="no_listing">매물 없음</option>
          <option value="no_candidate">정확한 품목 없음</option>
          <option value="unverified">미확인</option>
        </select>
      </label>

      <label>
        <span>상품권 할인율</span>
        <input id="discount-rate" type="number" min="0" max="100" step="0.1">
      </label>
      <label>
        <span>수수료</span>
        <select id="ah-fee-rate">
          <option value="5">5% 일반</option>
          <option value="3">3% MVP</option>
        </select>
      </label>
      <label>
        <span>1억당 마일리지 시세</span>
        <input id="base-mp-rate" type="number" min="0" step="10">
      </label>
    </section>

    <details class="filter-panel compact-panel" aria-label="큰 분류 필터" open>
      <summary class="compact-summary"><span>큰 분류</span></summary>
      <div class="filter-panel-body">
        <div class="filter-group major-filter-group">
          <div class="filter-heading">
            <h2>큰 분류</h2>
            <button id="major-filter-reset" type="button">초기화</button>
          </div>
          <div id="major-filter-list" class="major-filter-list" role="group" aria-label="큰 분류"></div>
          <div id="job-group-filter-wrap" class="job-group-filter" hidden>
            <span class="job-group-label">직업군</span>
            <div id="job-group-filter-list" class="job-group-list" role="group" aria-label="직업군"></div>
          </div>
        </div>
      </div>
    </details>

    <details class="manual-panel compact-panel" aria-label="수동 계산">
      <summary class="section-title compact-summary">
        <h2>수동 계산</h2>
        <span id="manual-save-state" class="count-pill">내 가격 저장</span>
      </summary>
      <div class="manual-grid">
        <label>
          <span>아이템명</span>
          <input id="manual-name" type="text" placeholder="예: 메이플 로얄 스타일" autocomplete="off">
        </label>
        <label>
          <span>분류</span>
          <input id="manual-category" type="text" placeholder="기본 · 랜덤 · 패키지" autocomplete="off">
        </label>
        <label>
          <span>캐시 가격</span>
          <input id="manual-cash-price" type="number" min="0" step="100" placeholder="2200">
        </label>
        <label>
          <span>경매장 가격</span>
          <input id="manual-meso-price" type="number" min="0" step="1000000" placeholder="81000000">
        </label>
        <label>
          <span>마일리지 혜택</span>
          <select id="manual-mileage-type">
            <option value="none">할인 불가</option>
            <option value="partial">30% 할인</option>
            <option value="full">전액 결제</option>
          </select>
        </label>
        <article class="result-card" id="manual-result">
          <span>계산 결과</span>
          <strong id="manual-efficiency">-</strong>
          <small id="manual-detail">값을 입력하면 바로 계산됩니다.</small>
        </article>
      </div>
      <div class="action-row">
        <button id="calculate-manual" type="button">계산</button>
        <button id="save-manual-price" type="button">내 가격으로 적용</button>
        <button id="save-manual-item" class="admin-only" type="button" hidden>항목 저장</button>
        <button id="clear-manual" type="button" class="ghost-button">초기화</button>
      </div>
    </details>

    <section id="management-panel" class="management-panel" aria-label="데이터 관리" hidden>
      <div class="plain-title">
        <h2>데이터 관리</h2>
        <span id="management-mode" class="count-pill">공개 모드</span>
      </div>
      <div class="manager-grid">
        <article class="manager-block admin-only" hidden>
          <div class="block-title">
            <h3>항목 수정</h3>
            <span id="item-override-state">기본 데이터</span>
          </div>
          <div class="editor-grid">
            <label class="wide-field">
              <span>항목</span>
              <select id="admin-item-select">
                <option value="">새 항목</option>
              </select>
            </label>
            <label>
              <span>아이템명</span>
              <input id="admin-item-name" type="text" autocomplete="off">
            </label>
            <label>
              <span>분류</span>
              <input id="admin-item-category" type="text" autocomplete="off">
            </label>
            <label>
              <span>캐시 가격</span>
              <input id="admin-item-cash" type="number" min="0" step="100">
            </label>
            <label>
              <span>기본 가격</span>
              <input id="admin-item-seed" type="number" min="0" step="1000000">
            </label>
            <label>
              <span>마일리지 혜택</span>
              <select id="admin-item-mileage">
                <option value="none">할인 불가</option>
                <option value="partial">30% 할인</option>
                <option value="full">전액 결제</option>
              </select>
            </label>
            <label class="wide-field">
              <span>검색 별칭</span>
              <textarea id="admin-item-aliases" rows="3" placeholder="줄바꿈 또는 쉼표로 구분"></textarea>
            </label>
            <label class="wide-field">
              <span>구성품</span>
              <textarea id="admin-item-components" rows="5" placeholder="구성품명 | 기본가격"></textarea>
            </label>
          </div>
          <div class="action-row compact">
            <button id="save-admin-item" type="button">항목 저장</button>
            <button id="delete-admin-item" type="button" class="danger-button">삭제</button>
            <button id="reset-admin-items" type="button" class="ghost-button">기본값</button>
            <button id="export-items" type="button" class="ghost-button">항목 내보내기</button>
          </div>
        </article>

        <article class="manager-block member-only" hidden>
          <div class="block-title">
            <h3>데이터 가져오기</h3>
            <span id="import-state">대기</span>
          </div>
          <label class="wide-field import-field">
            <span>데이터</span>
            <textarea id="data-import" rows="9" placeholder="내보낸 가격 또는 항목 데이터를 붙여넣기"></textarea>
          </label>
          <div class="action-row compact">
            <button id="import-prices" type="button">가격 가져오기</button>
            <button id="export-prices" type="button" class="ghost-button">가격 내보내기</button>
            <button id="import-items" class="admin-only" type="button" hidden>항목 가져오기</button>
            <button id="clear-import" type="button" class="ghost-button">비우기</button>
          </div>
        </article>
      </div>
    </section>

    <main>
      <section class="table-panel" aria-label="효율 목록">
        <div class="section-title">
          <h2>효율 목록</h2>
          <div class="table-heading-actions">
            <label class="page-size-control">
              <select id="page-size" aria-label="페이지당 표시 개수">
                <option value="15">15개씩</option>
                <option value="30">30개씩</option>
                <option value="0">전체</option>
              </select>
            </label>
            <span id="row-count" class="count-pill">0개</span>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">순위</th>
                <th scope="col">아이템</th>
                <th scope="col">구매 가격</th>
                <th scope="col">매물가/참고가</th>
                <th scope="col">판매 효율/절약</th>
              </tr>
            </thead>
            <tbody id="item-rows"></tbody>
          </table>
        </div>
        <nav class="table-pagination" aria-label="효율 목록 페이지">
          <button id="page-prev" class="page-button" type="button" aria-label="이전 페이지" title="이전 페이지">‹</button>
          <span id="page-state" aria-live="polite">0 / 0</span>
          <button id="page-next" class="page-button" type="button" aria-label="다음 페이지" title="다음 페이지">›</button>
        </nav>
      </section>

      <details class="market-info">
        <summary class="compact-summary"><span>판매 정보</span></summary>
        <div class="side-stack">
          <section class="notice-panel" aria-label="캐시샵 업데이트">
            <div class="section-title">
              <h2>캐시샵 업데이트</h2>
            </div>
            <div id="notice-list" class="notice-list"></div>
          </section>

          <section class="sale-panel" aria-label="판매 품목">
            <div class="section-title">
              <h2>판매 품목</h2>
            </div>
            <div class="sale-filters" aria-label="판매 품목 필터">
              <label>
                <span>품목 검색</span>
                <input id="sale-search-input" type="search" placeholder="판매 품목 검색" autocomplete="off">
              </label>
              <label>
                <span>판매글</span>
                <select id="sale-group-filter">
                  <option value="">전체 판매글</option>
                </select>
              </label>
              <label>
                <span>품목 분류</span>
                <select id="sale-type-filter">
                  <option value="">전체 분류</option>
                  <option value="패키지">패키지</option>
                  <option value="쿠폰">쿠폰</option>
                  <option value="확률형">확률형</option>
                  <option value="펫">펫</option>
                  <option value="펫장비">펫장비</option>
                  <option value="치장">치장</option>
                  <option value="기타">기타</option>
                </select>
              </label>
              <label>
                <span>상태</span>
                <select id="sale-review-filter">
                  <option value="all">전체</option>
                  <option value="confirmed">확인됨</option>
                  <option value="review">확인 필요</option>
                </select>
              </label>
            </div>
            <div id="sale-item-list" class="sale-list"></div>
          </section>
        </div>
      </details>
    </main>
  </div>

  <template id="empty-template">
    <tr>
      <td colspan="5" class="empty">표시할 항목이 없습니다.</td>
    </tr>
  </template>

  <script type="module" src="./app.js?v=0.9.5"></script>
</body>
</html>
